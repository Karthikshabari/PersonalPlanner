name: personal_planner
description: "Personal Planner — offline-first day planner for Ubuntu desktop and Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Database (Drift + SQLite)
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^16.0.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.7
  intl: ^0.20.0
  path_provider: ^2.1.5
  file_picker: ^12.1.2
  path: ^1.9.1
  rrule: ^0.2.18
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_foreground_task: ^11.0.1
  fl_chart: ^0.69.0
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^7.3.1
  screen_retriever: ^0.2.2
  window_manager: ^0.5.1
  stack_trace: ^1.12.1

  # Required at runtime by Flutter's generated Android plugin registrant.
  # The integration test API remains used only by integration-test targets.
  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/branding/app_logo_with_text.png
